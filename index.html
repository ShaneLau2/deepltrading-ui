<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deepltrading · 交易系统控制台</title>
  <!-- 相对路径: 本地由 /static 挂载、GitHub Pages 由仓库 static/ 目录提供, 两处通用。
       图表/导出库已 vendor 到本地(web/static/vendor), 不依赖 jsdelivr CDN(国内常不可达)。
       版本号自动生成: ?v= 由 web/static_assets.py 按文件 mtime 注入(app.py 实时 /
       deploy_ui.py 部署时), 改 JS/CSS 后无需手动 bump —— 请勿在模板里手写 ?v=。 -->
  <link rel="stylesheet" href="static/style.css?v=1788945142892045801" />
  <script src="static/vendor/chart.umd.min.js?v=1788634549063186078"></script>
  <script src="static/vendor/chartjs-adapter-date-fns.bundle.min.js?v=1788634549437776445"></script>
  <script src="static/vendor/chartjs-chart-financial.min.js?v=1788634549844265932"></script>
  <script src="static/vendor/jspdf.umd.min.js?v=1788634550603748236"></script>
  <script src="static/vendor/jspdf.plugin.autotable.min.js?v=1788634551232968049"></script>
</head>
<body>
  <div class="bg-layers" aria-hidden="true">
    <div class="bg-aurora"></div>
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
  </div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">Δ</div>
        <div>
          <h1>deepltrading</h1>
          <p>美股日线波段交易神经网络系统 · 控制台</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="pill" id="jobPill"><i class="pill-dot"></i>空闲</span>
        <span class="meta-item" id="signalFresh">—</span>
        <span class="meta-item" id="apiBaseBox" title="后端地址: 本机直连留空; 从 GitHub Pages 打开时填 http://127.0.0.1:8766 即可真实操作"></span>
      </div>
    </header>

    <nav class="stepper" id="stepper">
      <button type="button" class="step active" data-page="overview">
        <span class="step-index">00</span>
        <span class="step-body"><span class="step-title">总览</span><span class="step-sub">模型健康 · 净值</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="research">
        <span class="step-index">01</span>
        <span class="step-body"><span class="step-title">研究流水线</span><span class="step-sub">一键研究 · 训练/回测/进化/特征</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="signals">
        <span class="step-index">02</span>
        <span class="step-body"><span class="step-title">实时信号</span><span class="step-sub">选股 · 交易计划</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="paper">
        <span class="step-index">03</span>
        <span class="step-body"><span class="step-title">模拟实盘</span><span class="step-sub">纸上交易 · 成交流水</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="logs">
        <span class="step-index">04</span>
        <span class="step-body"><span class="step-title">运行日志</span><span class="step-sub">错误扫描 · 日志查看</span></span>
      </button>
    </nav>

    <main id="pages">
      <section class="page" data-page="overview"><div class="page-inner" id="page-overview"></div></section>
      <section class="page" data-page="research"><div class="page-inner" id="page-research"></div></section>
      <section class="page" data-page="signals"><div class="page-inner" id="page-signals"></div></section>
      <section class="page" data-page="paper"><div class="page-inner" id="page-paper"></div></section>
      <section class="page" data-page="logs"><div class="page-inner" id="page-logs"></div></section>
      <!-- 研究流水线的四个子区容器(一级导航隐藏, 由研究页展开渲染) -->
      <section class="page" data-page="train"><div class="page-inner" id="page-train"></div></section>
      <section class="page" data-page="backtest"><div class="page-inner" id="page-backtest"></div></section>
      <section class="page" data-page="evolve"><div class="page-inner" id="page-evolve"></div></section>
      <section class="page" data-page="pipeline"><div class="page-inner" id="page-pipeline"></div></section>
    </main>

    <div id="pxModal" class="modal-overlay" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-label="个股行情图">
        <div class="modal-head">
          <div><h3 id="pxTitle" style="margin:0">个股行情</h3><span class="dim" id="pxSub"></span></div>
          <button type="button" class="btn small" onclick="closePxModal()">✕ 关闭</button>
        </div>
        <div class="modal-body" id="pxBody"><div class="loading">加载行情…</div></div>
        <div class="modal-foot" id="pxMeta"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="static/backend.js?v=1788638139536680041"></script>
  <!-- 核心 + 页面模块: app.js 为共享工具, pages/*.js 按页拆分(经典脚本共享全局词法环境),
       boot.js 必须最后加载(恢复上次页面 + 后端连接)。 -->
  <script src="static/app.js?v=1788925771040395687"></script>
  <script src="static/weekly_charts.js?v=1788925788653367129"></script>
  <script src="static/pages/overview.js?v=1788891205351008393"></script>
  <script src="static/pages/research.js?v=1788880047621589725"></script>
  <script src="static/pages/signals.js?v=1788830165264137567"></script>
  <script src="static/pages/paper.js?v=1788879259665449305"></script>
  <script src="static/pages/logs.js?v=1788882461553683151"></script>
  <script src="static/pages/boot.js?v=1788826285433828171"></script>
</body>
</html>
