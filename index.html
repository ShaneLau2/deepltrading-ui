<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deepltrading · 交易系统控制台</title>
  <!-- 相对路径: 本地由 /static 挂载、GitHub Pages 由仓库 static/ 目录提供, 两处通用。
       图表/导出库已 vendor 到本地(web/static/vendor), 不依赖 jsdelivr CDN(国内常不可达)。 -->
  <link rel="stylesheet" href="static/style.css?v=34" />
  <script src="static/vendor/chart.umd.min.js"></script>
  <script src="static/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="static/vendor/chartjs-chart-financial.min.js"></script>
  <script src="static/vendor/jspdf.umd.min.js"></script>
  <script src="static/vendor/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="bg-layers" aria-hidden="true">
    <div class="bg-aurora"></div>
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
  </div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">Δ</div>
        <div>
          <h1>deepltrading</h1>
          <p>美股日线波段交易神经网络系统 · 控制台</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="pill" id="jobPill"><i class="pill-dot"></i>空闲</span>
        <span class="meta-item" id="signalFresh">—</span>
        <span class="meta-item" id="apiBaseBox" title="后端地址: 本机直连留空; 从 GitHub Pages 打开时填 http://127.0.0.1:8766 即可真实操作"></span>
      </div>
    </header>

    <nav class="stepper" id="stepper">
      <button type="button" class="step active" data-page="overview">
        <span class="step-index">00</span>
        <span class="step-body"><span class="step-title">总览</span><span class="step-sub">模型健康 · 净值</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="train">
        <span class="step-index">01</span>
        <span class="step-body"><span class="step-title">模型训练</span><span class="step-sub">多管线训练 · 批量对比</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="backtest">
        <span class="step-index">02</span>
        <span class="step-body"><span class="step-title">策略回测</span><span class="step-sub">资金曲线 · 绩效评估</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="signals">
        <span class="step-index">03</span>
        <span class="step-body"><span class="step-title">实时信号</span><span class="step-sub">选股 · 交易计划</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="paper">
        <span class="step-index">04</span>
        <span class="step-body"><span class="step-title">模拟实盘</span><span class="step-sub">纸上交易 · 成交流水</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="evolve">
        <span class="step-index">05</span>
        <span class="step-body"><span class="step-title">模型自进化</span><span class="step-sub">调度 · 重训 · 竞技场</span></span>
      </button>
      <span class="step-link"></span>
      <button type="button" class="step" data-page="pipeline">
        <span class="step-index">06</span>
        <span class="step-body"><span class="step-title">候选特征流水线</span><span class="step-sub">挖掘 → 复核 → 竞技场</span></span>
      </button>
    </nav>

    <main id="pages">
      <section class="page" data-page="overview"><div class="page-inner" id="page-overview"></div></section>
      <section class="page" data-page="train"><div class="page-inner" id="page-train"></div></section>
      <section class="page" data-page="backtest"><div class="page-inner" id="page-backtest"></div></section>
      <section class="page" data-page="signals"><div class="page-inner" id="page-signals"></div></section>
      <section class="page" data-page="paper"><div class="page-inner" id="page-paper"></div></section>
      <section class="page" data-page="evolve"><div class="page-inner" id="page-evolve"></div></section>
      <section class="page" data-page="pipeline"><div class="page-inner" id="page-pipeline"></div></section>
    </main>

    <div id="pxModal" class="modal-overlay" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-label="个股行情图">
        <div class="modal-head">
          <div><h3 id="pxTitle" style="margin:0">个股行情</h3><span class="dim" id="pxSub"></span></div>
          <button type="button" class="btn small" onclick="closePxModal()">✕ 关闭</button>
        </div>
        <div class="modal-body" id="pxBody"><div class="loading">加载行情…</div></div>
        <div class="modal-foot" id="pxMeta"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="static/backend.js?v=3"></script>
  <script src="static/app.js?v=57"></script>
</body>
</html>
